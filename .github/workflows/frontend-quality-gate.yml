name: Frontend Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/release-hardening-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend quality gate
        run: npm run quality-gate

      - name: Install browser for offline-work review acceptance
        run: npx playwright install --with-deps chromium

      - name: Verify retained-work reviews in EN RU HE
        run: npx playwright test e2e/execution-time-correction.spec.ts e2e/missing-factory-price.spec.ts --workers=1

      - name: Retain compact review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-time-review-screenshots
          path: test-results
          retention-days: 3
          if-no-files-found: ignore
